name: Flux Diff
"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    name: Flux Local Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so flate can resolve origin/main as the diff baseline
          fetch-depth: 0
      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
      - name: Diff
        id: diff
        env:
          DIFF_FILE: ${{ runner.temp }}/flate-diff.md
        run: |
          flate diff --base origin/main --path cluster -o github > "$DIFF_FILE"
          if [ -s "$DIFF_FILE" ]; then
            echo "has-diff=true" >> "$GITHUB_OUTPUT"
          fi
      - name: PR Comments
        uses: mshick/add-pr-comment@v2
        if: steps.diff.outputs.has-diff == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: ${{ github.event.pull_request.number }}/cluster
          message-path: ${{ runner.temp }}/flate-diff.md
