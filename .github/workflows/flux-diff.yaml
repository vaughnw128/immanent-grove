name: Flux Diff
"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    name: Flux Local Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so flate can resolve origin/main as the diff baseline
          fetch-depth: 0
      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
      - name: Diff
        id: diff
        env:
          RAW_FILE: ${{ runner.temp }}/flate-diff.txt
          DIFF_FILE: ${{ runner.temp }}/flate-diff.md
        run: |
          flate diff --base origin/main --path cluster -o github > "$RAW_FILE"
          if [ -s "$RAW_FILE" ]; then
            # flate's github output is plain diff text, not Markdown. Fence it so
            # GitHub renders it as a diff, and stay under the 65,536 character
            # comment limit.
            {
              echo '```diff'
              head -c 60000 "$RAW_FILE"
              echo
              echo '```'
              if [ "$(wc -c < "$RAW_FILE")" -gt 60000 ]; then
                echo '_Diff truncated to fit the comment size limit. Run `flate diff` locally for the full output._'
              fi
            } > "$DIFF_FILE"
            echo "has-diff=true" >> "$GITHUB_OUTPUT"
          fi
      - name: PR Comments
        uses: mshick/add-pr-comment@v2
        if: steps.diff.outputs.has-diff == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: ${{ github.event.pull_request.number }}/cluster
          message-path: ${{ runner.temp }}/flate-diff.md
