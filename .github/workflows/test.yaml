name: Flux Tests

"on":
  pull_request:
  push:
    branches:
      - "main"

jobs:
  manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@version/v0.20.0
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@version/v0.20.0
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@version/v0.20.0
      - name: Validate manifests
        run: bash ./scripts/validate-flux.sh

  render:
    name: Render with flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
      - name: Test manifests
        run: flate test --path cluster
