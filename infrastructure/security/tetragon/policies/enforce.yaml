apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: enforce-kernel-modules
  annotations:
    description: Kill container processes that load kernel modules
spec:
  options:
  - name: policy-mode
    value: monitor
  podSelector:
    matchExpressions:
    - key: k8s:io.kubernetes.pod.namespace
      operator: In
      values:
      - applications
      - monitoring
      - operators
      - cnpg-system
      - controllers
      - flux-system
  kprobes:
  - call: sys_init_module
    syscall: true
    selectors:
    - matchNamespaces:
      - namespace: Pid
        operator: NotIn
        values: &id001
        - host_ns
      matchActions:
      - action: Sigkill
  - call: sys_finit_module
    syscall: true
    selectors:
    - matchNamespaces:
      - namespace: Pid
        operator: NotIn
        values: *id001
      matchActions:
      - action: Sigkill
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: enforce-namespace-escape
