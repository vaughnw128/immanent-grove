apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: controllers
spec:
  interval: 30m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: democratic-csi
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: controllers
      interval: 12h
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi"
    storageClasses:
    - name: truenas-iscsi
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
        fsType: ext4
      mountOptions: []
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:
    controller:
      driver:
        image:
          registry: docker.io/democraticcsi/democratic-csi
          tag: next
          pullPolicy: Always
        extraEnv:
          - name: TRUENAS_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: truenas-api-key
                key: truenas-api-key
    node:
      hostPID: true
      driver:
        image:
          registry: docker.io/democraticcsi/democratic-csi
          tag: next
          pullPolicy: Always
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        iscsiDirHostPath: /var/iscsi
        iscsiDirHostPathType: ""
    driver:
      config:
        driver: freenas-api-iscsi
        httpConnection:
          protocol: https
          port: 443
          allowInsecure: true
          host: 10.0.0.3
          apiKey: "${TRUENAS_API_TOKEN}"
        zfs:
          datasetParentName: pool/k8s/iscsi/v
          detachedSnapshotsDatasetParentName: pool/k8s/iscsi/s
          zvolCompression: lz4
          zvolDedup: false
          zvolEnableReservation: false
          zvolBlocksize: 16K
        iscsi:
          targetPortal: "10.0.0.3:3260"
          targetPortals: []
          interface: ""
          namePrefix: csi-
          nameSuffix: "-immanent-grove"
          targetGroups:
            - targetGroupPortalGroup: 2
              targetGroupInitiatorGroup: 10
              targetGroupAuthType: None
          extentInsecureTpc: true
          extentXenCompat: false
          extentDisablePhysicalBlocksize: true
          extentBlocksize: 4096
          extentRpm: SSD
          extentAvailThreshold: 0
