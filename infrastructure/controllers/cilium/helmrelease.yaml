apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: cilium
      version: "1.20.5"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  values:
    ipam:
        mode: kubernetes
    kubeProxyReplacement: true
    encryption:
        enabled: true
        type: wireguard
    authentication:
        enabled: true
        mutual:
            spire:
                enabled: true
                install:
                    enabled: true
                    namespace: cilium-spire
                    existingNamespace: true
                    server:
                        dataStorage:
                            enabled: true
                            size: 1Gi
                            storageClass: truenas-iscsi
    securityContext:
        capabilities:
            ciliumAgent:
                - CHOWN
                - KILL
                - NET_ADMIN
                - NET_RAW
                - IPC_LOCK
                - SYS_ADMIN
                - SYS_RESOURCE
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
            cleanCiliumState:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
    cgroup:
        autoMount:
            enabled: false
        hostRoot: "/sys/fs/cgroup"
    k8sServiceHost: localhost
    devices:
        - eth0
    k8sServicePort: 7445
    gatewayAPI:
        enabled: true
        enableAlpn: true
        enableAppProtocol: true
        secretsNamespace:
          sync: true
    l2announcements:
        enabled: true
    ingressController:
        enabled: false
    envoy:
        enabled: true
        prometheus:
            serviceMonitor:
                enabled: true
    prometheus:
        enabled: true
        serviceMonitor:
            enabled: true
            trustCRDsExist: true
    dashboards:
        enabled: true
    operator:
        prometheus:
            enabled: true
            serviceMonitor:
                enabled: true
        dashboards:
            enabled: true
    hubble:
        peerService:
            clusterDomain: cluster.local
        relay:
            enabled: true
            prometheus:
                enabled: true
                serviceMonitor:
                    enabled: true
        ui:
            enabled: true
        export:
            static:
                enabled: true
                filePath: /var/run/cilium/hubble/events.log
                fileMaxSizeMb: 50
                fileMaxBackups: 3
        tls:
            auto:
              enabled: true
              method: helm
              certValidityDuration: 2000
        metrics:
            enableOpenMetrics: true
            serviceMonitor:
                enabled: true
            dashboards:
                enabled: true
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - port-distribution
              - icmp
              - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction