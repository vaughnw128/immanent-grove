apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 60m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: cloudnative-pg
      version: "0.29.2"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
      interval: 12h
  values:
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
