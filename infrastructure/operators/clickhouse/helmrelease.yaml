apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: operators
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: controllers
  chart:
    spec:
      chart: clickhouse-operator-helm
      version: "0.0.8"
      sourceRef:
        kind: HelmRepository
        name: clickhouse-operator
        namespace: operators
      interval: 12h
  values:
    controller:
      watchNamespaces:
        - applications
    crd:
      enabled: true
      keep: true
