apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-operator
  namespace: operators
spec:
  interval: 30m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: mongodb-kubernetes
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: operators
      interval: 12h
  values:
    operator:
      watchNamespace: monitoring
      watchedResources:
        - mongodbcommunity
      enableClusterMongoDBRoles: false
      telemetry:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          memory: 1Gi
