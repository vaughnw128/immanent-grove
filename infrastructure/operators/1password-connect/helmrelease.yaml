apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 1password-connect
  namespace: operators
spec:
  interval: 30m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: connect
      version: "2.4.3"
      sourceRef:
        kind: HelmRepository
        name: 1password-connect
        namespace: operators
      interval: 12h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: onepassword-connect
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
              spec:
                template:
                  spec:
                    containers:
                      - name: connect-api
                        env:
                          - name: OP_SESSION
                            value: null
                            valueFrom:
                              secretKeyRef:
                                name: op-credentials
                                key: 1password-credentials.json
                      - name: connect-sync
                        env:
                          - name: OP_SESSION
                            value: null
                            valueFrom:
                              secretKeyRef:
                                name: op-credentials
                                key: 1password-credentials.json
