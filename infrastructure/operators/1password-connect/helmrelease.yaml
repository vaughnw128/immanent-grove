apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 1password-connect
  namespace: operators
spec:
  interval: 30m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: connect
      version: "2.4.3"
      sourceRef:
        kind: HelmRepository
        name: 1password-connect
        namespace: operators
      interval: 12h