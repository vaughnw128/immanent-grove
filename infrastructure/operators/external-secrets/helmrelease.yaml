apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: operators
spec:
  interval: 60m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: external-secrets
      version: "2.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: operators
      interval: 12h
  values:
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
