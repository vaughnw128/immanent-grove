apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  dependsOn:
    - name: clickhouse-operator
      namespace: operators
    - name: mongodb-operator
      namespace: operators
    - name: democratic-csi-iscsi
      namespace: controllers
  install:
    remediation:
      retries: 3
  chart:
    spec:
      reconcileStrategy: Revision
      chart: clickstack
      version: "3.8.0"
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: monitoring
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: clickstack-values
      valuesKey: clickhouse-password
      targetPath: clickstack.secrets.CLICKHOUSE_PASSWORD
    - kind: Secret
      name: clickstack-values
      valuesKey: clickhouse-app-password
      targetPath: clickstack.secrets.CLICKHOUSE_APP_PASSWORD
    - kind: Secret
      name: clickstack-values
      valuesKey: mongodb-password
      targetPath: clickstack.secrets.MONGODB_PASSWORD
    - kind: Secret
      name: clickstack-ingestion
      valuesKey: HYPERDX_API_KEY
      targetPath: clickstack.secrets.HYPERDX_API_KEY
      optional: true
  values:
    clickstack:
      config:
        FRONTEND_URL: https://clickstack.internal.vw-ops.net
        USAGE_STATS_ENABLED: "false"
        HYPERDX_OTEL_EXPORTER_TABLES_TTL: 720h
      deployment:
        nodeSelector:
          kubernetes.io/hostname: talos-worker-1
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

    mongodb:
      spec:
        members: 1
        type: ReplicaSet
        version: "5.0.32"
        security:
          authentication:
            modes:
              - SCRAM
        users:
          - name: hyperdx
            db: hyperdx
            passwordSecretRef:
              name: '{{ include "clickstack.mongodb.fullname" . }}-password'
            roles:
              - name: dbOwner
                db: hyperdx
              - name: clusterMonitor
                db: admin
            scramCredentialsSecretName: '{{ include "clickstack.mongodb.fullname" . }}-scram'
        additionalMongodConfig:
          storage.wiredTiger.engineConfig.journalCompressor: zlib
        statefulSet:
          spec:
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: talos-worker-1
            volumeClaimTemplates:
              - metadata:
                  name: data-volume
                spec:
                  storageClassName: truenas-iscsi
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
              - metadata:
                  name: logs-volume
                spec:
                  storageClassName: truenas-iscsi
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi

    clickhouse:
      keeper:
        spec:
          containerTemplate:
            image:
              repository: clickhouse/clickhouse-keeper
              tag: "26.8.37.168-alpine"
          replicas: 1
          podTemplate:
            nodeSelector:
              kubernetes.io/hostname: talos-worker-1
          dataVolumeClaimSpec:
            storageClassName: truenas-iscsi
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
      cluster:
        spec:
          containerTemplate:
            image:
              repository: clickhouse/clickhouse-server
              tag: "26.8.37.168-alpine"
            resources:
              requests:
                cpu: "1"
                memory: 4Gi
              limits:
                memory: 6Gi
          replicas: 1
          shards: 1
          keeperClusterRef:
            name: '{{ include "clickstack.clickhouse.keeper" . }}'
          podTemplate:
            nodeSelector:
              kubernetes.io/hostname: talos-worker-1
          dataVolumeClaimSpec:
            storageClassName: truenas-iscsi
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
          settings:
            extraUsersConfig:
              users:
                app:
                  password: '{{ .Values.clickstack.secrets.CLICKHOUSE_APP_PASSWORD }}'
                  profile: default
                  grants:
                    - query: "GRANT SHOW ON *.*, SELECT ON system.*, SELECT ON default.*, CREATE TEMPORARY TABLE ON *.*"
                otelcollector:
                  password: '{{ .Values.clickstack.secrets.CLICKHOUSE_PASSWORD }}'
                  profile: default
                  grants:
                    - query: "GRANT SELECT,INSERT,CREATE,SHOW ON default.*"
            logger:
              level: information
              size: 100M
              count: 10
            extraConfig:
              max_connections: 4096
              keep_alive_timeout: 64
              max_concurrent_queries: 100
              query_log:
                ttl: event_date + INTERVAL 30 DAY DELETE
              part_log:
                ttl: event_date + INTERVAL 30 DAY DELETE
              text_log:
                ttl: event_date + INTERVAL 30 DAY DELETE
              metric_log:
                ttl: event_date + INTERVAL 30 DAY DELETE
              asynchronous_metric_log:
                ttl: event_date + INTERVAL 30 DAY DELETE

    otel-collector:
      serviceMonitor:
        enabled: true
      nodeSelector:
        kubernetes.io/hostname: talos-worker-1
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
