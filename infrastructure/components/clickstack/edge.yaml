apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-edge
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: clickstack
      namespace: monitoring
  chart:
    spec:
      reconcileStrategy: Revision
      chart: opentelemetry-collector
      version: "0.182.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: monitoring
      interval: 12h
  values:
    mode: deployment
    replicaCount: 1
    image:
      repository: otel/opentelemetry-collector-contrib
    presets:
      kubernetesEvents:
        enabled: true
        useK8sEventsReceiver: true
    extraEnvs:
      - name: HYPERDX_API_KEY
        valueFrom:
          secretKeyRef:
            name: clickstack-ingestion
            key: HYPERDX_API_KEY
            optional: true
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        lbipam.cilium.io/ips: 10.0.10.20
    ports:
      otlp:
        enabled: false
      otlp-http:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      syslog-udp:
        enabled: true
        containerPort: 5514
        servicePort: 514
        protocol: UDP
      syslog-tcp:
        enabled: true
        containerPort: 5601
        servicePort: 601
        protocol: TCP
      netflow:
        enabled: true
        containerPort: 2055
        servicePort: 2055
        protocol: UDP
      talos:
        enabled: true
        containerPort: 6051
        servicePort: 6051
        protocol: TCP
      metrics:
        enabled: true
    podMonitor:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    config:
      receivers:
        jaeger: null
        zipkin: null
        otlp: null
        prometheus: null
        syslog/udp:
          udp:
            listen_address: 0.0.0.0:5514
            add_attributes: true
          protocol: rfc3164
          location: America/New_York
          on_error: send_quiet
          operators:
            - type: add
              field: resource["service.name"]
              value: syslog
        syslog/tcp:
          tcp:
            listen_address: 0.0.0.0:5601
            add_attributes: true
          protocol: rfc5424
          on_error: send_quiet
          operators:
            - type: add
              field: resource["service.name"]
              value: syslog
        netflow:
          scheme: netflow
          port: 2055
          sockets: 1
          workers: 2
        tcplog/talos:
          listen_address: 0.0.0.0:6051
          add_attributes: true
          operators:
            - type: json_parser
              parse_from: body
            - type: add
              field: resource["service.name"]
              value: talos
      processors:
        resource/netflow:
          attributes:
            - key: service.name
              value: netflow
              action: upsert
      exporters:
        otlphttp/clickstack:
          endpoint: http://clickstack-otel-collector.monitoring.svc.cluster.local:4318
          headers:
            authorization: ${env:HYPERDX_API_KEY}
          compression: gzip
      service:
        pipelines:
          traces: null
          metrics: null
          logs:
            receivers:
              - syslog/udp
              - syslog/tcp
              - tcplog/talos
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlphttp/clickstack
          logs/netflow:
            receivers:
              - netflow
            processors:
              - memory_limiter
              - resource/netflow
              - batch
            exporters:
              - otlphttp/clickstack
