apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-values
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: clickstack-values
    creationPolicy: Owner
  data:
    - secretKey: clickhouse-password
      remoteRef:
        key: clickstack
        property: clickhouse-password
    - secretKey: clickhouse-app-password
      remoteRef:
        key: clickstack
        property: clickhouse-app-password
    - secretKey: mongodb-password
      remoteRef:
        key: clickstack
        property: mongodb-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-ingestion
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: clickstack-ingestion
    creationPolicy: Owner
  data:
    - secretKey: HYPERDX_API_KEY
      remoteRef:
        key: clickstack
        property: ingestion-api-key
