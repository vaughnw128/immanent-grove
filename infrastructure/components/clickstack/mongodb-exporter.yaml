apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: mongodb-exporter
    creationPolicy: Owner
    template:
      data:
        mongodb-uri: "mongodb://hyperdx:{{ .password | urlquery }}@clickstack-mongodb-svc.monitoring.svc.cluster.local:27017/hyperdx?authSource=hyperdx&directConnection=true"
  data:
    - secretKey: password
      remoteRef:
        key: clickstack
        property: mongodb-password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-exporter
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: clickstack
      namespace: monitoring
  chart:
    spec:
      reconcileStrategy: Revision
      chart: prometheus-mongodb-exporter
      version: "3.23.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    existingSecret:
      name: mongodb-exporter
      key: mongodb-uri
    extraArgs:
      - --collect-all
      - --compatible-mode
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
