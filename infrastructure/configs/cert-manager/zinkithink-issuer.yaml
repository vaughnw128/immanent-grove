# Issues certificates for zinkithink.com using a Cloudflare token scoped to that zone.
# The token lives in 1Password and is synced by External Secrets; nothing static in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-token-zinkithink
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  data:
  - secretKey: cloudflare-api-token
    remoteRef:
      key: cloudflare-zinkithink-com
      property: credential
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zinkithink-issuer
spec:
  acme:
    email: vaughnwoerpel@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: zinkithink-issuer-account-key
    solvers:
    - selector:
        dnsZones:
        - zinkithink.com
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-token-zinkithink
            key: cloudflare-api-token
