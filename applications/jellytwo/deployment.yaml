apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellytwo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellytwo
  template:
    metadata:
      labels:
        app: jellytwo
    spec:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "6"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: true
            - name: media
              mountPath: /usr/share/fonts
              subPath: fonts
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellytwo-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellytwo-cache
        - name: media
          nfs:
            server: 10.0.0.3
            path: /mnt/pool/media
            readOnly: true
