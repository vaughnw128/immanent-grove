apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zink-site-https
spec:
  parentRefs:
  - name: public-gateway
    namespace: default
    sectionName: https-zinkithink-bare
  hostnames:
  - zinkithink.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: zink-site
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zink-youtube-https
spec:
  parentRefs:
  - name: public-gateway
    namespace: default
    sectionName: https-zinkithink-wildcard
  hostnames:
  - youtube.zinkithink.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: zink-youtube
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zink-plant-kaiba-https
spec:
  parentRefs:
  - name: public-gateway
    namespace: default
    sectionName: https-zinkithink-wildcard
  hostnames:
  - plant-kaiba.zinkithink.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: zink-plant-kaiba
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zink-redirect
spec:
  parentRefs:
  - name: public-gateway
    namespace: default
    sectionName: http
  hostnames:
  - zinkithink.com
  - youtube.zinkithink.com
  - plant-kaiba.zinkithink.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
