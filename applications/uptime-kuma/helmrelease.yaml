apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: applications
spec:
  interval: 30m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: uptime-kuma
      version: "4.2.0"
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: applications
      interval: 12h
  values:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    image:
      repository: louislam/uptime-kuma
      tag: 2.5.12
    externalDatabase:
      type: "sqlite"
      enabled: false
    volume:
      enabled: true
      accessMode: ReadWriteOnce
      size: 4Gi
    strategy:
      type: Recreate
