apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: langfuse
    creationPolicy: Owner
  data:
    - secretKey: salt
      remoteRef:
        key: langfuse
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: langfuse
        property: encryption-key
    - secretKey: nextauth-secret
      remoteRef:
        key: langfuse
        property: nextauth-secret
    - secretKey: clickhouse-password
      remoteRef:
        key: langfuse
        property: clickhouse-password
    - secretKey: redis-password
      remoteRef:
        key: langfuse
        property: redis-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: langfuse-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: langfuse-s3
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: langfuse-s3
        property: secret-access-key
