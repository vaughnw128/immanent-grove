apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashbrr-https
spec:
  parentRefs:
    - name: default-gateway
      namespace: default
  hostnames:
    - dashbrr.internal.vw-ops.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashbrr
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashbrr-redirect
spec:
  parentRefs:
    - name: default-gateway
      namespace: default
      sectionName: http
  hostnames:
    - dashbrr.internal.vw-ops.net
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
