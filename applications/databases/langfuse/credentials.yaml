apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-pg-app
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  target:
    name: langfuse-pg-app
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
          reconcile.fluxcd.io/watch: Enabled
      data:
        username: langfuse-app
        password: "{{ .password }}"
        uri: "postgresql://langfuse-app:{{ .password | urlquery }}@grove-cluster-rw.applications.svc.cluster.local:5432/langfuse"
        # Roll consumers when the password changes without exposing it in pod metadata.
        revision: "{{ .password | sha256sum }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: cluster-generator
