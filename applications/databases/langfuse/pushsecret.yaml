apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: langfuse-pg-app-push
spec:
  deletionPolicy: None
  updatePolicy: Replace
  refreshInterval: 1m
  secretStoreRefs:
    - name: 1password-sdk
      kind: ClusterSecretStore
  selector:
    secret:
      name: langfuse-pg-app
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: langfuse-pg-app
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: langfuse-pg-app
          property: password
    - match:
        secretKey: uri
        remoteRef:
          remoteKey: langfuse-pg-app
          property: uri
